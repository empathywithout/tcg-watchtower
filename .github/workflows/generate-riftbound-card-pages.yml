name: Generate Riftbound Card Pages

on:
  workflow_dispatch:
    inputs:
      set_id:
        description: 'Set ID (ogn, spf, unl, vnd, rad)'
        required: true
        type: choice
        options:
          - ogn
          - spf
          - unl
          - vnd
          - rad
      set_full_name:
        description: 'Full set name (e.g. Origins)'
        required: true
        type: string
      set_url_slug:
        description: 'URL slug (e.g. origins)'
        required: true
        type: string
      set_short_name:
        description: 'Short badge (e.g. OGN)'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Riftbound individual card pages
        env:
          SET_ID:           ${{ inputs.set_id }}
          SET_FULL_NAME:    ${{ inputs.set_full_name }}
          SET_URL_SLUG:     ${{ inputs.set_url_slug }}
          SET_SHORT_NAME:   ${{ inputs.set_short_name }}
          CF_R2_PUBLIC_URL: ${{ secrets.CF_R2_PUBLIC_URL }}
        run: node scripts/generate-riftbound-card-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate Riftbound ${{ inputs.set_id }} card pages"
          git push
