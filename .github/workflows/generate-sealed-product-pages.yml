name: Generate Sealed Product Pages

on:
  workflow_dispatch:
    inputs:
      limit_to:
        description: 'Comma-separated set IDs to regenerate (e.g. ogn,me05) — leave blank for all'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate sealed product pages
        env:
          LIMIT_TO: ${{ inputs.limit_to }}
        run: node scripts/generate-sealed-product-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate sealed product pages${LIMIT_TO:+ (${LIMIT_TO})}"
          git push
        env:
          LIMIT_TO: ${{ inputs.limit_to }}
